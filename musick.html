<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>UAPIMP — БЛЕКУХА</title>

<style>

body {
    background: #080008;
    color: #d8a7ff;
    font-family: monospace;
    text-align: center;
    margin: 0;
    padding: 30px;
}

h1 {
    color: #c15cff;
    text-shadow:
        0 0 5px #b84cff,
        0 0 20px #8b00ff;
}

.playlist {
    width: 700px;
    max-width: 90%;
    height: 450px;
    margin: 30px auto;
    padding: 10px;

    overflow-y: auto;

    border: 1px solid #8b2fc9;
    background: #080008;

    box-shadow:
        0 0 20px #6d2094,
        inset 0 0 25px #180020;
}

.track {
    padding: 18px;
    margin-bottom: 10px;

    border: 1px solid #4d176b;
    background: #100016;
}

.track-name {
    display: block;
    margin-bottom: 10px;

    color: #ff7de9;
    text-align: left;
}

.track audio {
    width: 100%;
}

.back {
    color: #ff7de9;
    text-decoration: none;
}

.back:hover {
    color: white;
}

</style>
</head>


<body>

<h1>♡ БЛЕКУХА ♡</h1>

<p>♫ зара слухаю таку імбу, прям блекач уффф ♫</p>


<div class="playlist">

    <div class="track">
        <span class="track-name">01. Yello</span>

        <audio controls>
            <source src="music/Yello.mp3" type="audio/mpeg">
        </audio>
    </div>


    <div class="track">
        <span class="track-name">02. 229</span>

        <audio controls>
            <source src="music/229.mp3" type="audio/mpeg">
        </audio>
    </div>


    <div class="track">
        <span class="track-name">03. ХЗВ КЛИЧКО</span>

        <audio controls>
            <source src="music/ХЗВ КЛИЧКО.mp3" type="audio/mpeg">
        </audio>
    </div>


    <div class="track">
        <span class="track-name">04. My Cat Jack Off Jill</span>

        <audio controls>
            <source src="music/My Cat Jack Off Jill.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="track">
        <span class="track-name">05. MFGreenGrey</span>

        <audio controls>
            <source src="music/MFGreenGrey.mp3" type="audio/mpeg">
        </audio>
    </div>

   <div class="track">
        <span class="track-name">06. ОРЕСТ ЛЮТИЙ котлети з онука</span>

        <audio controls>
            <source src="music/ОРЕСТ ЛЮТИЙ котлети з онука.mp3" type="audio/mpeg">
        </audio>
    </div>

   <div class="track">
        <span class="track-name">07. Моя планета Фліт</span>

        <audio controls>
            <source src="music/Моя планета Фліт.mp3" type="audio/mpeg">
        </audio>
    </div>


    <div class="track">
        <span class="track-name">08. ЗЕ ЕНД...</span>
    </div>

</div>


<a href="index.html" class="back">
← назад на головну
</a>


</body>
</html>
